name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch packages removed upstream (e.g. EOL formulae)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHEZMOI_VERSION: v2.74.1

jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [darwin-work, darwin-personal, fedora, asahi, arch, cachyos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi and fish
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq fish
      - name: Render and lint templates
        run: .github/scripts/check-templates.sh "${{ matrix.case }}"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check Homebrew packages exist
        run: .github/scripts/check-packages.sh
